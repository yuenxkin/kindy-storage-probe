<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BARCODE storage probe</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Storage probe" />
<style>
  :root { color-scheme: dark; --ok:#4ade80; --no:#f87171; --warn:#fbbf24; --dim:#9ca3af; --bg:#0b0f14; --card:#151b23; --line:#263040; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:#e5e7eb; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; padding:env(safe-area-inset-top) 14px 48px; max-width:640px; margin-inline:auto; }
  h1 { font-size:17px; margin:16px 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .verdict { font-size:19px; font-weight:700; margin-bottom:6px; }
  .ok{color:var(--ok)} .no{color:var(--no)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--dim); width:46%; }
  button { width:100%; padding:15px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:#2563eb; color:#fff; margin-top:8px; }
  button.alt { background:#374151; }
  button:disabled { background:#374151; color:#9ca3af; }
  pre { font-family:ui-monospace,Menlo,monospace; font-size:11px; white-space:pre-wrap; word-break:break-all; color:var(--dim); margin:0; }
  code { background:#0e141b; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<h1>BARCODE storage probe</h1>
<div class="sub">kindy-docs#183 · does the browser actually hold the only copy</div>

<div class="card">
  <div class="verdict" id="verdict">reading…</div>
  <div id="verdictNote" class="dim" style="font-size:13px"></div>
</div>

<div class="card">
  <table><tbody id="facts"></tbody></table>
</div>

<div class="card">
  <button id="plant">Plant the archive</button>
  <button id="persist" class="alt">Ask for persistent storage</button>
  <button id="copy" class="alt">Copy report</button>
</div>

<div class="card"><pre id="log"></pre></div>

<script>
const DB = "barcode-storage-probe", STORE = "records", PLANT_ID = "__plant__";
const FILLER = 400;               // records, each ~1KB — a plausible archive
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent = new Date().toISOString().slice(11,19) + "  " + m + "\n" + $("log").textContent; };
let state = {};

function open_() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "code" }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const tx = (db, mode) => db.transaction(STORE, mode).objectStore(STORE);
const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function read() {
  let db;
  try { db = await open_(); } catch (e) { log("indexedDB.open FAILED: " + e); return { error: String(e) }; }
  const plant = await req(tx(db, "readonly").get(PLANT_ID)).catch(() => null);
  const count = await req(tx(db, "readonly").count()).catch(() => 0);
  return { plant, count };
}

async function facts() {
  const f = {};
  f["Origin"] = location.origin;
  f["Now"] = new Date().toISOString();
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  f["Running as"] = standalone ? "home-screen app" : "browser tab";
  if (navigator.storage && navigator.storage.persisted) {
    try { f["storage.persisted()"] = String(await navigator.storage.persisted()); }
    catch (e) { f["storage.persisted()"] = "threw: " + e; }
  } else f["storage.persisted()"] = "API absent";
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const e = await navigator.storage.estimate();
      f["Quota"] = e.quota != null ? (e.quota/1048576).toFixed(0) + " MB" : "not reported";
      f["Used"] = e.usage != null ? (e.usage/1024).toFixed(0) + " KB" : "not reported";
    } catch (e) { f["Quota"] = "threw: " + e; }
  } else f["Quota"] = "estimate() absent";
  f["User agent"] = navigator.userAgent;
  return f;
}

function render(r, f) {
  const v = $("verdict"), n = $("verdictNote");
  if (r.error) { v.className = "verdict no"; v.textContent = "IndexedDB unavailable"; n.textContent = r.error; }
  else if (!r.plant) {
    v.className = "verdict warn"; v.textContent = "Nothing planted here";
    n.textContent = "Either this is the first visit on this device, or the storage was cleared. Press Plant to start the clock.";
  } else {
    const days = (Date.now() - r.plant.at) / 86400000;
    const intact = r.count >= FILLER;
    v.className = "verdict " + (intact ? "ok" : "no");
    v.textContent = intact
      ? `SURVIVED ${days.toFixed(1)} days`
      : `PARTIAL LOSS after ${days.toFixed(1)} days`;
    n.innerHTML = `Planted <code>${r.plant.id}</code> on ${new Date(r.plant.at).toISOString().slice(0,16).replace("T"," ")}. `
      + `${r.count - 1} of ${FILLER} filler records present.`;
  }
  $("facts").innerHTML = Object.entries(f).map(([k, val]) =>
    `<tr><td>${k}</td><td>${String(val)}</td></tr>`).join("");
  state = { plant: r.plant || null, count: r.count, facts: f };
}

async function refresh() { const r = await read(); const f = await facts(); render(r, f); return r; }

$("plant").onclick = async () => {
  const b = $("plant"); b.disabled = true; b.textContent = "planting…";
  try {
    const db = await open_();
    const id = Math.random().toString(36).slice(2, 8).toUpperCase();
    const snapshot = "x".repeat(900);   // stand-in for a resolver payload
    await new Promise((res, rej) => {
      const t = db.transaction(STORE, "readwrite"), s = t.objectStore(STORE);
      s.put({ code: PLANT_ID, id, at: Date.now(), ua: navigator.userAgent });
      for (let i = 0; i < FILLER; i++) s.put({ code: "probe-" + String(i).padStart(4, "0"), snapshot, i });
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
    log("planted " + FILLER + " records, id " + id);
  } catch (e) { log("plant FAILED: " + e); alert("Plant failed: " + e); }
  b.disabled = false; b.textContent = "Plant the archive";
  await refresh();
};

$("persist").onclick = async () => {
  if (!navigator.storage || !navigator.storage.persist) { log("storage.persist() absent"); alert("persist() not supported here"); return; }
  try { const g = await navigator.storage.persist(); log("storage.persist() returned " + g); alert("persist() returned " + g); }
  catch (e) { log("persist() threw: " + e); }
  await refresh();
};

$("copy").onclick = async () => {
  const txt = JSON.stringify({ spike: "kindy-docs#183", readAt: new Date().toISOString(), ...state }, null, 2);
  try { await navigator.clipboard.writeText(txt); alert("Report copied."); }
  catch { $("log").textContent = txt; alert("Clipboard blocked — the report is in the log below, select and copy it."); }
};

refresh().then(() => log("ready"));
</script>
</body>
</html>
